<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Скаут Хаус | ППР</title>
    
    <!-- Подключение шрифтов и стилей (как в dashboard.html) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ШАПКА: Идентична dashboard.html -->
    <header class="top-bar">
        <div class="top-bar-left">
            <!-- Логотип и заголовок -->
            <div class="logo-small">
                <img src="assets/images/logo.svg" alt="Скаут Хаус" class="logo-small-img">
                <span>Скаут Хаус - Панель управления</span>
            </div>
        </div>
        <div class="top-bar-right">
            <!-- Элементы профиля (заполняются через kb.js/auth.js) -->
            <div class="user-info">
                <span id="userName"></span>
                <span id="userRole" class="user-role-badge"></span>
            </div>
            <a href="#" id="logoutBtn" class="btn-admin">Выйти</a>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="admin-container">
        
        <!-- БЛОК УПРАВЛЕНИЯ ПОЛЬЗОВАТЕЛЯМИ -->
        <section class="admin-section">
            <h2> Пользователи</h2>
            
            <!-- Форма добавления -->
            <form id="addUserForm" class="admin-form">
                <h3>Добавить пользователя</h3>
                <div id="formError" class="error-message" style="display: none;"></div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="userName">ФИО</label>
                        <input type="text" id="userName" required placeholder="Иванов Иван Иванович">
                    </div>
                    <div class="form-group">
                        <label for="userLogin">Логин</label>
                        <input type="text" id="userLogin" required placeholder="ivanov">
                    </div>
                    <div class="form-group">
                        <label for="userPassword">Пароль</label>
                        <input type="password" id="userPassword" required minlength="6" placeholder="Минимум 6 символов">
                    </div>
                    <div class="form-group">
                        <label for="userRole">Роль</label>
                        <select id="userRole" required>
                            <option value="worker">Сотрудник производства</option>
                            <option value="guest">Гость</option>
                            <option value="admin">Администратор</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Доступ к разделам базы знаний:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="sections" value="preparation"> Заготовка</label>
                        <label><input type="checkbox" name="sections" value="panels"> Сборка панелей</label>
                        <label><input type="checkbox" name="sections" value="module"> Сборка модуля</label>
                        <label><input type="checkbox" name="sections" value="options"> Сборка опций</label>
                        <label><input type="checkbox" name="sections" value="installation"> Монтаж</label>
                        <label><input type="checkbox" name="sections" value="service"> Сервис</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Добавить пользователя</button>
            </form>

            <!-- Таблица пользователей -->
            <h3>Список пользователей</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Логин</th>
                        <th>Роль</th>
                        <th>Доступ к разделам</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Заполняется через js/admin-panel.js -->
                </tbody>
            </table>
        </section>

        <!-- БЛОК МОНИТОРИНГА -->
        <section class="admin-section">
            <h2>📊 Мониторинг ознакомления</h2>
            <p style="color: #64748b; margin-bottom: 15px;">Просмотр матрицы ознакомления сотрудников с операциями.</p>
            <a href="monitoring.html" class="btn-primary">Открыть мониторинг</a>
        </section>

    </main>

    <!-- СКРИПТЫ: Порядок важен! Сначала auth/kb, потом логика админки -->
    <script src="js/auth.js"></script>
    <script src="js/kb.js"></script>
    <script src="js/admin-panel.js"></script>
</body>
</html>
