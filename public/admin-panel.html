<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Скаут Хаус | ППР</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- ШАПКА: Очищена от статического текста -->
    <header class="top-bar">
        <div class="top-bar-left">
            <!-- Логотип и заголовок -->
            <img src="assets/images/logo.svg" alt="" class="logo-img">
            <h1>Скаут Хаус - Панель управления</h1>
        </div>
        <div class="top-bar-right">
            <!-- Кнопка "В базу знаний" (если нужна статически, иначе kb.js добавит сам) -->
            <a href="dashboard.html" class="btn-admin btn-back-kb">← В базу знаний</a>
            
            <!-- Контейнеры для данных пользователя (ПУСТЫЕ!) -->
            <span id="userName"></span>
            <span id="userRole"></span>
            
            <!-- Кнопка выхода -->
            <button id="logoutBtn" class="btn-admin">Выйти</button>
        </div>
    </header>

    <main class="container">
        <!-- БЛОК ПОЛЬЗОВАТЕЛЕЙ -->
        <section class="card">
            <h2>👥 Пользователи</h2>
            
            <form id="addUserForm" class="admin-form">
                <h3>Добавить пользователя</h3>
                <div id="formError" class="error-message" style="display: none; color: #dc2626;"></div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="userNameInput">ФИО</label>
                        <input type="text" id="userNameInput" required placeholder="Иванов Иван Иванович">
                    </div>
                    <div class="form-group">
                        <label for="userLoginInput">Логин</label>
                        <input type="text" id="userLoginInput" required placeholder="ivanov">
                    </div>
                    <div class="form-group">
                        <label for="userPasswordInput">Пароль</label>
                        <input type="password" id="userPasswordInput" required minlength="6">
                    </div>
                    <div class="form-group">
                        <!-- ВАЖНО: ID изменен на userRoleSelect, чтобы не конфликтовать с #userRole в шапке -->
                        <label for="userRoleSelect">Роль</label>
                        <select id="userRoleSelect" required>
                            <option value="worker">Сотрудник производства</option>
                            <option value="guest">Гость</option>
                            <option value="admin">Администратор</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Доступ к разделам базы знаний:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="sections" value="preparation"> Заготовка</label>
                        <label><input type="checkbox" name="sections" value="panels"> Сборка панелей</label>
                        <label><input type="checkbox" name="sections" value="module"> Сборка модуля</label>
                        <label><input type="checkbox" name="sections" value="options"> Сборка опций</label>
                        <label><input type="checkbox" name="sections" value="installation"> Монтаж</label>
                        <label><input type="checkbox" name="sections" value="service"> Сервис</label>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Добавить пользователя</button>
            </form>

            <h3>Список пользователей</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Логин</th>
                        <th>Роль</th>
                        <th>Доступ к разделам</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Заполняется через js/admin-panel.js -->
                </tbody>
            </table>
        </section>

        <!-- БЛОК МОНИТОРИНГА -->
        <section class="card">
            <h2>📊 Мониторинг ознакомления</h2>
            <p>Просмотр матрицы ознакомления сотрудников с операциями.</p>
            <a href="monitoring.html" class="btn-primary">Открыть мониторинг</a>
        </section>
    </main>

    <!-- СКРИПТЫ -->
    <script src="js/auth.js"></script>
    <script src="js/kb.js"></script>
    <script src="js/admin-panel.js"></script>
</body>
</html>
