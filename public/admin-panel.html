<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Скаут Хаус | ППР</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Верхняя навигация (ЗАФИКСИРОВАНА) -->
    <header class="top-bar">
        <div class="top-bar-left">
            <div class="logo-small">
                <img src="assets/images/logo.svg" alt="Скаут Хаус" class="logo-small-img">
                <span>Скаут Хаус - Панель управления администратора</span>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">А</div>
                <div class="user-details">
                    <span class="user-name" id="userName">Пользователь</span>
                    <span class="user-role" id="userRole">Роль</span>
                </div>
            </div>
            <button class="btn-logout" id="logoutBtn" title="Выйти">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span>Выйти</span>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>👥 Пользователи</h2>
            
<form id="addUserForm" class="admin-form" autocomplete="off">
    <h3>Добавить пользователя</h3>
    <div id="formError" class="error-message" style="display: none; color: #dc2626;"></div>
    
    <div class="form-row">
        <div class="form-group">
            <label for="userNameInput">ФИО</label>
            <input type="text" id="userNameInput" required placeholder="Иванов Иван Иванович" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="userLoginInput">Логин</label>
            <input type="text" id="userLoginInput" required placeholder="ivanov" autocomplete="off">
        </div>
        <div class="form-group">
            <label for="userPasswordInput">Пароль</label>
            <input type="password" id="userPasswordInput" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="userRoleSelect">Роль</label>
            <select id="userRoleSelect" required>
                <option value="worker">Сотрудник производства</option>
                <option value="guest">Гость</option>
                <option value="admin">Администратор</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Доступ к разделам базы знаний:</label>
        <div class="checkbox-group">
            <label><input type="checkbox" name="sections" value="preparation"> Заготовка</label>
            <label><input type="checkbox" name="sections" value="panels"> Сборка панелей</label>
            <label><input type="checkbox" name="sections" value="module"> Сборка модуля</label>
            <label><input type="checkbox" name="sections" value="options"> Сборка опций</label>
            <label><input type="checkbox" name="sections" value="installation"> Монтаж</label>
            <label><input type="checkbox" name="sections" value="service"> Сервис</label>
        </div>
    </div>

    <button type="submit" class="btn-primary">Добавить пользователя</button>
</form>

            <h3>Список пользователей</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ФИО</th>
                        <th>Логин</th>
                        <th>Роль</th>
                        <th>Доступ к разделам</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <!-- Заполняется через js/admin-panel.js -->
                </tbody>
            </table>
        </section>

        <section class="card">
            <h2>📊 Мониторинг ознакомления</h2>
            <p>Просмотр матрицы ознакомления сотрудников с операциями.</p>
            <a href="monitoring.html" class="btn-primary">Открыть мониторинг</a>
        </section>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/kb.js"></script>
    <script src="js/admin-panel.js"></script>
</body>
</html>
