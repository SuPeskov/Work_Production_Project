<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <base href="/Work_Production_Project/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Скаут Хаус | Проект производства работ</title>
    
    <!-- Подключение шрифтов Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

    <div class="login-wrapper">
        <!-- Левая панель — бренд (теперь на белом фоне) -->
        <div class="login-brand">
            <div class="brand-content">
                <!-- ЛОГОТИП: замените src на путь к вашему файлу -->
                <div class="brand-logo">
                    <img src="assets/images/logo.svg" alt="Скаут Хаус" class="logo-img">
                </div>
                <h1>Скаут Хаус</h1>
                <p class="brand-subtitle">Проект производства работ</p>
                <div class="brand-features">
                    <div class="feature-item">
                        <span class="feature-icon">📋</span>
                        <span>Пооперационные карты</span>
                    </div>
                    <div class="feature-item">
                        <span class="feature-icon">🔧</span>
                        <span>Инструкции по монтажу</span>
                    </div>
                     <div class="feature-item">
                        <span class="feature-icon">🛡️</span>
                        <span>Стандарты и регламенты</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Правая панель — форма входа -->
        <div class="login-form-panel">
            <div class="form-container">
                <h2>Вход в систему</h2>
                <p class="form-description">Введите учётные данные для доступа к проекту производства работ</p>

                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">Логин</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                                <circle cx="12" cy="7" r="4"/>
                            </svg>
                            <input type="text" id="username" name="username" placeholder="Введите логин" required autocomplete="username">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">Пароль</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                            </svg>
                            <input type="password" id="password" name="password" placeholder="Введите пароль" required autocomplete="current-password">
                            <button type="button" class="toggle-password" id="togglePassword" aria-label="Показать пароль">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                    <circle cx="12" cy="12" r="3"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-wrapper">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Запомнить меня
                        </label>
                    </div>

                    <div id="errorMessage" class="error-message hidden">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="15" y1="9" x2="9" y2="15"/>
                            <line x1="9" y1="9" x2="15" y2="15"/>
                        </svg>
                        <span id="errorText">Неверный логин или пароль</span>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        <span>Войти в систему</span>
                        <svg class="btn-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <polyline points="12 5 19 12 12 19"/>
                        </svg>
                    </button>
                </form>

                <div class="form-footer">
                    <p>Нет доступа? Обратитесь к администратору системы</p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/users.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
