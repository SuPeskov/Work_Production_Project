<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления — Скаут Хаус | ППР</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
        .admin-tabs { display: flex; gap: 8px; margin: 24px 0; border-bottom: 2px solid #e2e8f0; }
        .admin-tab { background: none; border: none; padding: 12px 20px; font: 600 15px Inter, sans-serif; color: #64748b; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; }
        .admin-tab.active { color: #2563eb; border-bottom-color: #2563eb; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .admin-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        .admin-card h2 { font-size: 18px; margin: 0 0 16px; }
        table.admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th { text-align: left; padding: 10px 12px; background: #f8fafc; color: #475569; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
        .admin-table td { padding: 10px 12px; border-bottom: 1px solid #eef2f7; vertical-align: middle; }
        .badge-role { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
        .badge-admin { background: #ede9fe; color: #6d28d9; }
        .badge-worker { background: #dbeafe; color: #1d4ed8; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .form-row label { font-size: 13px; font-weight: 600; color: #475569; display: block; margin-bottom: 4px; }
        .form-row input[type=text], .form-row input[type=password], .form-row select {
            width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: 400 14px Inter, sans-serif; }
        .access-checks { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 8px 0 14px; }
        .access-checks label { font-weight: 400; color: #334155; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .btn-sm { padding: 6px 12px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; font: 500 13px Inter, sans-serif; cursor: pointer; }
        .btn-sm:hover { background: #f1f5f9; }
        .btn-danger { color: #dc2626; border-color: #fecaca; }
        .btn-danger:hover { background: #fef2f2; }
        .btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; font-weight: 600; padding: 10px 22px; }
        .btn-primary:hover { background: #1d4ed8; }
        .admin-msg { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 14px; display: none; }
        .admin-msg.ok { display: block; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }
        .admin-msg.err { display: block; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .btn-admin { display: flex; align-items: center; gap: 8px; background: #6d28d9; color: #fff; border-radius: 8px; padding: 8px 14px; font: 600 14px Inter, sans-serif; text-decoration: none; margin-right: 12px; }
        .btn-admin:hover { background: #5b21b6; }
        .btn-guest { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; padding: 12px; border: 1.5px dashed #94a3b8; border-radius: 10px; background: #f8fafc; color: #475569; font: 600 14px Inter, sans-serif; cursor: pointer; }
        .btn-guest:hover { background: #eff6ff; border-color: #2563eb; color: #2563eb; }
        .card-disabled { opacity: .55; cursor: not-allowed; position: relative; }
        .card-badge-lock { background: #fef2f2; color: #b91c1c; }
    </style>
</head>
<body class="dashboard-page">

<header class="top-bar">
    <div class="top-bar-left">
        <div class="logo-small">
            <img src="assets/images/logo.svg" alt="Скаут Хаус" class="logo-small-img">
            <span>Скаут Хаус — Панель управления</span>
        </div>
    </div>
    <div class="top-bar-right">
        <div class="user-info">
            <div class="user-avatar" id="userAvatar">А</div>
            <div class="user-details">
                <span class="user-name" id="userName">Администратор</span>
                <span class="user-role" id="userRole">Администратор</span>
            </div>
        </div>
        <button class="btn-logout" id="logoutBtn" title="Выйти">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Выйти</span>
        </button>
    </div>
</header>

<main class="admin-wrap">
    <h1 style="font-size:26px;">Управление базой знаний</h1>

    <div class="admin-tabs">
        <button class="admin-tab active" data-tab="users">👥 Пользователи</button>
        <a class="admin-tab" href="monitoring.html" style="text-decoration:none;">📊 Мониторинг ознакомления</a>
    </div>

    <!-- === Вкладка: пользователи === -->
    <section class="admin-panel active" id="tab-users">

        <div class="admin-card">
            <h2>Добавить пользователя</h2>
            <div class="admin-msg" id="addMsg"></div>
            <div class="form-row">
                <div><label>ФИО</label><input type="text" id="fName" placeholder="Иванов Иван Иванович"></div>
                <div><label>Логин</label><input type="text" id="fLogin" placeholder="ivanov"></div>
                <div><label>Пароль</label><input type="password" id="fPass" placeholder="минимум 4 символа"></div>
                <div><label>Роль</label>
                    <select id="fRole">
                        <option value="Сотрудник производства" selected>Сотрудник производства</option>
                        <option value="Администратор">Администратор</option>
                    </select>
                </div>
            </div>
            <label style="font-size:13px;font-weight:600;color:#475569;">Доступ к разделам базы знаний:</label>
            <div class="access-checks" id="fAccess"></div>
            <button class="btn-sm btn-primary" id="btnAddUser">Добавить пользователя</button>
        </div>

        <div class="admin-card">
            <h2>Список пользователей</h2>
            <div class="admin-msg" id="listMsg"></div>
            <table class="admin-table">
                <thead><tr><th>ФИО</th><th>Логин</th><th>Роль</th><th>Доступ к разделам</th><th>Действия</th></tr></thead>
                <tbody id="usersTbody"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="js/users.js"></script>
<script src="js/auth.js"></script>
<script src="js/kb.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    // Защита: только Администратор
    if (!isAuthenticated() || getCurrentUser().role !== 'Администратор') {
        window.location.href = 'index.html';
        return;
    }
    const user = getCurrentUser();
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
    document.getElementById('logoutBtn').onclick = function (e) { e.preventDefault(); logout(); location.href = 'index.html'; };

    // Чекбоксы разделов в форме добавления
    const accBox = document.getElementById('fAccess');
    KB_SECTIONS.forEach(s => {
        const l = document.createElement('label');
        l.innerHTML = `<input type="checkbox" value="${s.id}"> ${s.title}`;
        accBox.appendChild(l);
    });

    function msg(elId, text, ok) {
        const el = document.getElementById(elId);
        el.textContent = text;
        el.className = 'admin-msg ' + (ok ? 'ok' : 'err');
        setTimeout(() => el.className = 'admin-msg', 4000);
    }

    // Добавить пользователя
    document.getElementById('btnAddUser').addEventListener('click', function () {
        const access = Array.from(accBox.querySelectorAll('input:checked')).map(i => i.value);
        try {
            kbAddUser({
                name: document.getElementById('fName').value,
                username: document.getElementById('fLogin').value,
                password: document.getElementById('fPass').value,
                role: document.getElementById('fRole').value,
                access: access
            });
            msg('addMsg', 'Пользователь добавлен', true);
            ['fName','fLogin','fPass'].forEach(id => document.getElementById(id).value = '');
            accBox.querySelectorAll('input').forEach(i => i.checked = false);
            renderUsers();
        } catch (e) {
            msg('addMsg', e.message, false);
        }
    });

    // Список + действия
    function renderUsers() {
        const tbody = document.getElementById('usersTbody');
        tbody.innerHTML = '';
        kbGetUsers().forEach(u => {
            const tr = document.createElement('tr');
            const isSelf = u.username === getCurrentUser().username;
            const sections = u.role === 'Администратор' ? 'все разделы' :
                (u.access || []).map(id => (kbGetSectionById(id) || {title:id}).title).join(', ') || '—';
            tr.innerHTML = `
                <td>${u.name}</td>
                <td><code>${u.username}</code></td>
                <td><span class="badge-role ${u.role==='Администратор'?'badge-admin':'badge-worker'}">${u.role}</span></td>
                <td>${sections}</td>
                <td style="white-space:nowrap;">
                    <button class="btn-sm" data-a="pass" data-u="${u.username}">Пароль…</button>
                    <button class="btn-sm" data-a="acc" data-u="${u.username}" ${u.role==='Администратор'?'disabled':''}>Доступ…</button>
                    <button class="btn-sm btn-danger" data-a="del" data-u="${u.username}" ${isSelf?'disabled title="Нельзя удалить себя"':''}>Удалить</button>
                </td>`;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('usersTbody').addEventListener('click', function (e) {
        const btn = e.target.closest('button[data-a]');
        if (!btn || btn.disabled) return;
        const uname = btn.dataset.u, act = btn.dataset.a;
        const target = kbFindUser(uname);
        if (!target) return;

        if (act === 'del') {
            if (!confirm(`Удалить пользователя «${target.name}» (${uname})?`)) return;
            kbDeleteUser(uname);
            msg('listMsg', 'Пользователь удалён', true);
            renderUsers();
        }
        if (act === 'pass') {
            const np = prompt(`Новый пароль для «${target.name}» (${uname}):`);
            if (np === null) return;
            try { kbSetPassword(uname, np.trim()); msg('listMsg', 'Пароль изменён', true); }
            catch (err) { msg('listMsg', err.message, false); }
        }
        if (act === 'acc') {
            openAccessModal(target);
        }
    });

    // Модальное окно редактирования доступа
    function openAccessModal(target) {
        let m = document.getElementById('accModal');
        if (!m) {
            m = document.createElement('div');
            m.id = 'accModal';
            m.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;z-index:9999;';
            m.innerHTML = `<div style="background:#fff;border-radius:12px;padding:26px;max-width:420px;width:92%;font-family:Inter,sans-serif;">
                <h3 style="margin:0 0 14px;font-size:17px;" id="accModalTitle"></h3>
                <div class="access-checks" id="accModalChecks" style="flex-direction:column;gap:8px;"></div>
                <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
                    <button class="btn-sm" id="accCancel">Отмена</button>
                    <button class="btn-sm btn-primary" id="accSave">Сохранить</button>
                </div></div>`;
            document.body.appendChild(m);
            m.addEventListener('click', e => { if (e.target === m) m.style.display = 'none'; });
            document.getElementById('accCancel').onclick = () => m.style.display = 'none';
            document.getElementById('accSave').onclick = () => {
                const ids = Array.from(m.querySelectorAll('#accModalChecks input:checked')).map(i => i.value);
                kbSetAccess(m.dataset.user, ids);
                m.style.display = 'none';
                msg('listMsg', 'Права доступа обновлены', true);
                renderUsers();
            };
        }
        m.dataset.user = target.username;
        document.getElementById('accModalTitle').textContent = `Доступ: ${target.name} (${target.username})`;
        const box = document.getElementById('accModalChecks');
        box.innerHTML = '';
        KB_SECTIONS.forEach(s => {
            const l = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox'; cb.value = s.id;
            cb.checked = (target.access || []).includes(s.id);
            l.appendChild(cb); l.append(' ' + s.title);
            box.appendChild(l);
        });
        m.style.display = 'flex';
    }

    renderUsers();
});
</script>
</body>
</html>
